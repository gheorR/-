<!DOCTYPE html><html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для Карины</title><style>

body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#ff7eb3,#ff758c);
color:white;
text-align:center;
overflow-x:hidden;
}

/* стартовый экран */

.screen{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:20px;
}

h1{
font-size:55px;
margin-bottom:10px;
}

p{
font-size:20px;
max-width:600px;
}

button{
margin-top:25px;
padding:15px 35px;
font-size:20px;
border:none;
border-radius:12px;
cursor:pointer;
background:white;
color:#ff4d88;
transition:0.3s;
}

button:hover{
transform:scale(1.1);
}

/* альбом */

#album{
display:none;
padding:40px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:25px;
max-width:900px;
margin:auto;
}

.card{
background:rgba(255,255,255,0.15);
border-radius:15px;
padding:15px;
backdrop-filter:blur(8px);
cursor:pointer;
}

.card img{
width:100%;
border-radius:10px;
}

.text{
margin-top:10px;
font-size:18px;
opacity:0;
transition:0.6s;
}

.card:hover .text{
opacity:1;
}

/* модальное фото */

#viewer{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
justify-content:center;
align-items:center;
flex-direction:column;
}

#viewer img{
max-width:80%;
border-radius:15px;
}

#viewer p{
margin-top:20px;
font-size:22px;
}

/* падающие сердечки */

.heart{
position:fixed;
top:-20px;
font-size:20px;
animation:fall linear;
}

@keyframes fall{
to{
transform:translateY(110vh);
}
}

/* финальное сердце */

#final{
display:none;
font-size:40px;
margin-top:40px;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.2)}
100%{transform:scale(1)}
}

</style></head><body><div class="screen" id="start"><h1>Карина 💖</h1><p>
У меня есть для тебя маленький сюрприз.  
Нажми кнопку и открой подарок.
</p><button onclick="openAlbum()">Открыть подарок 🎁</button>

</div><div id="album"><h1>С Днём Рождения 🎉</h1>
<p>Нажми на фотографии</p><div class="gallery"><div class="card" onclick="showPhoto('photo1.jpg','Ты делаешь мир ярче ✨')">
<img src="photo1.jpg">
<div class="text">Ты делаешь мир ярче ✨</div>
</div><div class="card" onclick="showPhoto('photo2.jpg','Твоя улыбка — настоящее счастье 😊')">
<img src="photo2.jpg">
<div class="text">Твоя улыбка — настоящее счастье 😊</div>
</div><div class="card" onclick="showPhoto('photo3.jpg','Оставайся такой же прекрасной 💫')">
<img src="photo3.jpg">
<div class="text">Оставайся такой же прекрасной 💫</div>
</div><div class="card" onclick="showPhoto('photo4.jpg','Пусть твоя жизнь будет полной радости ❤️')">
<img src="photo4.jpg">
<div class="text">Пусть твоя жизнь будет полной радости ❤️</div>
</div></div><button onclick="final()">Последний сюрприз 💖</button>

<div id="final">
❤️ Карина, с Днём Рождения ❤️
</div></div><div id="viewer" onclick="closeViewer()">
<img id="bigPhoto">
<p id="bigText"></p>
</div><script>

/* открыть альбом */

function openAlbum(){
document.getElementById("start").style.display="none"
document.getElementById("album").style.display="block"
}

/* просмотр фото */

function showPhoto(src,text){
document.getElementById("viewer").style.display="flex"
document.getElementById("bigPhoto").src=src
document.getElementById("bigText").innerText=text
}

function closeViewer(){
document.getElementById("viewer").style.display="none"
}

/* падающие сердечки */

function createHeart(){
let heart=document.createElement("div")
heart.className="heart"
heart.innerHTML="❤️"

heart.style.left=Math.random()*100+"vw"
heart.style.animationDuration=(Math.random()*3+2)+"s"

document.body.appendChild(heart)

setTimeout(()=>heart.remove(),5000)
}

setInterval(createHeart,500)

/* финал */

function final(){
document.getElementById("final").style.display="block"
}

</script></body>
</html>
